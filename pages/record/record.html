<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laid mark log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="/marks/key.js"></script>
<style>
:root{--paper:#F5F8FA;--surface:#FFFFFF;--ink:#0F2940;--muted:#5B6B7A;--line:#D5DEE6;--buoy:#FFC21A;--buoy-ink:#1A1400;--sea:#1D5C8C;--warn:#B3261E;--ok:#1E7A45;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0C1823;--surface:#12222F;--ink:#E8EEF3;--muted:#93A3B1;--line:#22364A;--sea:#6FB3E6;--warn:#FF8A80;--ok:#6FD39A;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0C1823;--surface:#12222F;--ink:#E8EEF3;--muted:#93A3B1;--line:#22364A;--sea:#6FB3E6;--warn:#FF8A80;--ok:#6FD39A;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;gap:10px;flex-wrap:wrap}
.top input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
#event{flex:1 1 140px;font-weight:700}
.who{display:flex;align-items:center;gap:8px;margin:8px 0 0;color:var(--muted);font-size:.85rem}
.who input{flex:1 1 auto;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:.9rem}
.races{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 4px}
.races button{padding:14px 0;border-radius:14px;border:2px solid var(--ink);background:transparent;font-size:1.25rem;font-weight:700}
.races button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sub{color:var(--muted);font-size:.92rem;margin:4px 0 16px}
label.lbl{display:block;font-weight:700;margin-bottom:6px}
#markName{width:100%;padding:14px 12px;font-size:1.2rem;border-radius:12px;border:2px solid var(--line);background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.95rem}
.record{display:block;width:100%;margin-top:6px;padding:20px 16px;border:none;border-radius:16px;background:var(--buoy);color:var(--buoy-ink);font-size:1.35rem;font-weight:700;box-shadow:0 3px 0 #C99400}
.record:active{transform:translateY(2px);box-shadow:0 1px 0 #C99400}
.record[aria-busy="true"]{background:repeating-linear-gradient(-45deg,var(--buoy) 0 14px,#FFD45C 14px 28px)}
@media (prefers-reduced-motion:no-preference){.record[aria-busy="true"]{background-size:40px 40px;animation:slide 1s linear infinite}@keyframes slide{to{background-position:40px 0}}}
#cancel{display:none;margin-top:8px;background:none;border:none;color:var(--muted);text-decoration:underline;padding:6px 0}
.status{margin:10px 0 0;min-height:1.4em;font-size:.95rem}
.status.err{color:var(--warn)}.status.ok{color:var(--ok)}
ul.list{list-style:none;margin:18px 0 0;padding:0;border-top:1px solid var(--line)}
ul.list li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.name{font-weight:700}.meta{color:var(--muted);font-size:.9rem}
.del{min-width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.empty{color:var(--muted);display:block!important}
.send{margin-top:26px;padding-top:16px;border-top:3px solid var(--ink)}
pre#preview{white-space:pre-wrap;word-break:break-word;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:inherit;font-size:.92rem;max-height:260px;overflow:auto;margin:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;padding:14px;border-radius:14px;font-weight:700;text-decoration:none;border:2px solid var(--ink);background:transparent;color:var(--ink)}
.btn.wa{grid-column:1/-1;background:#1F8A4C;border-color:#1F8A4C;color:#fff;font-size:1.15rem;padding:18px}
.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.opt{display:flex;gap:8px;align-items:center;margin:0 0 12px;color:var(--muted);font-size:.95rem}
.opt input{width:20px;height:20px}
.newday{margin-top:26px;background:none;border:none;color:var(--warn);text-decoration:underline;padding:8px 0}

.sync{display:flex;align-items:center;gap:8px;margin:14px 0 0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:.95rem}
.sync .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.sync.wait .dot{background:var(--buoy)} .sync.wait{border-color:var(--buoy)}
.sync.err .dot{background:var(--warn)} .sync.err{border-color:var(--warn)}
.tick{color:var(--ok);font-size:.85rem}.pend{color:var(--muted);font-size:.85rem}
details.backup{margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
details.backup summary{cursor:pointer;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <input id="event" aria-label="Series name" placeholder="Series name">
    <input id="date" type="date" aria-label="Race date">
  </div>
  <label class="who">Who's recording? <input id="recorder" autocomplete="off" maxlength="60" placeholder="optional"></label>

  <div class="races" role="group" aria-label="Race">
    <button data-r="1">Race 1</button><button data-r="2">Race 2</button><button data-r="3">Race 3</button>
  </div>
  <p class="sub">Record marks laid for this race. If a mark is moved, record it again: both fixes are kept with their times.</p>

  <label class="lbl" for="markName">Mark name</label>
  <input id="markName" autocomplete="off" autocapitalize="characters" placeholder="e.g. Windward, Start Pin, A">
  <div class="chips" id="chips"></div>
  <button class="record" id="record">Record mark here</button>
  <button id="cancel">Cancel fix</button>
  <p class="status" id="status" role="status" aria-live="polite"></p>

  <div class="sync" id="sync" aria-live="polite"><span class="dot"></span><span id="syncText">Nothing recorded yet</span></div>

  <ul class="list" id="list"></ul>

  <details class="backup">
    <summary>Backup: send by WhatsApp</summary>
    <label class="opt" style="margin-top:12px"><input type="checkbox" id="csv"> Include CSV lines for scoring</label>
    <pre id="preview"></pre>
    <div class="row">
      <a class="btn wa" id="wa" target="_blank" rel="noopener">Pick a chat in WhatsApp</a>
      <button class="btn" id="share">Share…</button>
      <button class="btn" id="copy">Copy text</button>
    </div>
  </details>

  <button class="newday" id="newDay">Start a new day (clears this phone)</button>
</div>
<script>
(function(){
/* ---------- always run the newest copy of this page ----------
   Browsers sometimes reuse an old saved copy. On opening, the page quietly checks the server's copy;
   if it is newer, it reloads once from a fresh address. Change PAGE_VERSION whenever the file is updated. */
const PAGE_VERSION='2026-10-03.1';
(async()=>{try{
  const r=await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'});
  const m=(await r.text()).match(/PAGE_VERSION='([^']+)'/);
  if(m&&m[1]!==PAGE_VERSION){
    let done=false;try{done=sessionStorage.getItem('pv-'+m[1])==='1';sessionStorage.setItem('pv-'+m[1],'1');}catch(_){}
    if(!done)location.replace(location.pathname+'?v='+encodeURIComponent(m[1]));
  }
}catch(_){}})();

/* ---------- settings: must match marks.php ---------- */
const ENDPOINT='/marks/marks.php';
/* The race key comes from /marks/key.js, which is uploaded to the server but never committed (the repository is
   public). The last key seen is kept on this phone, so a key.js that fails to load mid-race does not stop uploads. */
let RACE_KEY=(()=>{let k=typeof window.RACE_KEY==='string'&&window.RACE_KEY!=='CHANGE_ME'?window.RACE_KEY:'';
  try{if(k)localStorage.setItem('race-key',k);else k=localStorage.getItem('race-key')||'';}catch(e){}return k;})();
/* With no key (a phone that has never seen one, whose key.js did not load) every request first tries key.js again,
   so signal returning clears it without a reload. A refused key is re-read once, in case it was changed on the server. */
const KEY_URL=ENDPOINT.replace(/[^/]*$/,'key.js');
async function ensureKey(){
  if(RACE_KEY)return true;
  try{const r=await fetch(KEY_URL+'?t='+Date.now(),{cache:'no-store'});
    const m=r.ok&&(await r.text()).match(/RACE_KEY\s*=\s*'([^'\\]{6,})'/);
    if(m&&m[1]!=='CHANGE_ME'){RACE_KEY=m[1];try{localStorage.setItem('race-key',RACE_KEY);}catch(e){}}}catch(e){}
  return !!RACE_KEY;
}
async function keyFetch(url,opts){
  if(!(await ensureKey()))throw new Error('no race key');
  const go=()=>fetch(url,Object.assign({},opts,{headers:Object.assign({},opts.headers,{'X-Race-Key':RACE_KEY}),cache:'no-store'}));
  let r=await go();
  if(r.status===403){const old=RACE_KEY;RACE_KEY='';
    if(await ensureKey()&&RACE_KEY!==old)r=await go(); else RACE_KEY=RACE_KEY||old;}
  return r;
}

const K='laid-mark-log-v4';
const PRESETS=['Committee boat','Start Pin','Windward','Leeward','Offset','Gybe','Finish Pin','A','B','C','D',
  'Curlane','Dutchman','White Bay'];   // club laid marks: exact names, so the RO page uses the fix instead of the card position
const $=id=>document.getElementById(id);

/* ---------- who recorded each fix ----------
   A random id for this phone, made once and kept in this browser, plus an optional name typed by the crew.
   Both go to the server with every fix; neither appears in the list or the WhatsApp text.
   randomUUID needs HTTPS and a recent browser, so fall back rather than stop the page. */
const DEVICE_KEY='rib-device-id',RECORDER_KEY='rib-recorder';
function newUUID(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  const b=new Uint8Array(16);
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(b);else for(let i=0;i<16;i++)b[i]=Math.random()*256|0;
  b[6]=b[6]&15|64;b[8]=b[8]&63|128;
  const h=Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}
const DEVICE=(()=>{let d='';try{d=localStorage.getItem(DEVICE_KEY)||'';}catch(e){}
  if(!/^[0-9a-f-]{36}$/i.test(d)){d=newUUID();try{localStorage.setItem(DEVICE_KEY,d);}catch(e){}}
  return d;})();
let recorder='';try{recorder=localStorage.getItem(RECORDER_KEY)||'';}catch(e){}

const pad=(n,w)=>String(n).padStart(w,'0');
function todayISO(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2);}
function fresh(){return{event:'Series Name',date:todayISO(),race:1,marks:[],deletes:[],csv:true};}
function load(){try{const r=localStorage.getItem(K);if(r){const s=JSON.parse(r);if(s&&Array.isArray(s.marks)){s.deletes=s.deletes||[];return s;}}}catch(e){}return fresh();}
function save(){try{localStorage.setItem(K,JSON.stringify(S));}catch(e){}}
let S=load(),text='';
let newDayNote='';
if(S.date!==todayISO()){            // phone left over from a previous race day
  S.marks=S.marks.filter(m=>!m.sent); // unsent fixes keep their own date and still upload
  S.date=todayISO(); S.race=1; newDayNote='Date set to today. Check the race number before recording.';
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function ddm(v,isLat){const h=isLat?(v>=0?'N':'S'):(v>=0?'E':'W');const a=Math.abs(v);let d=Math.floor(a),ms=((a-d)*60).toFixed(3);if(ms==='60.000'){d++;ms='0.000';}return pad(d,isLat?2:3)+'°'+(parseFloat(ms)<10?'0':'')+ms+"'"+h;}
function hhmm(t){const d=new Date(t);return pad(d.getHours(),2)+':'+pad(d.getMinutes(),2);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function setStatus(m,c){const s=$('status');s.textContent=m||'';s.className='status'+(c?' '+c:'');}
function raceMarks(){return S.marks.filter(m=>m.race===S.race).sort((a,b)=>a.time-b.time);}
function withFix(list){const n={};return list.map(m=>{const k=m.name.toLowerCase();n[k]=(n[k]||0)+1;return{...m,fix:n[k]};});}
function fmtDate(iso){try{const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short',year:'numeric'});}catch(e){return iso;}}

/* ---------- upload queue ---------- */
let busy=false,lastErr='';
async function post(body){
  const r=await keyFetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){let e='server '+r.status;try{e=(await r.json()).error||e;}catch(_){}throw new Error(e);}
}
async function sync(){
  if(busy)return; busy=true; lastErr='';
  try{
    for(const m of S.marks.filter(m=>!m.sent)){
      await post({action:'add',id:m.id,series:m.series,date:m.date,race:m.race,name:m.name,lat:m.lat,lon:m.lon,acc:m.acc,time:m.time,device:DEVICE,recorder:m.recorder||''});
      m.sent=true; save(); renderSync(); renderList();
    }
    while(S.deletes.length){
      const d=S.deletes[0];
      await post({action:'delete',id:d.id,date:d.date});
      S.deletes.shift(); save();
    }
  }catch(e){lastErr=e.message||'no signal';}
  busy=false; renderSync(); renderList();
}
function renderSync(){
  const n=S.marks.filter(m=>!m.sent).length+S.deletes.length;
  const el=$('sync'),t=$('syncText');
  if(!S.marks.length&&!n){el.className='sync';t.textContent='Nothing recorded yet';return;}
  if(!n){el.className='sync';t.textContent='All fixes sent to the RO and scorer';return;}
  const nokey=lastErr==='no race key', bad=!nokey&&/key|403/i.test(lastErr);
  el.className='sync '+(bad?'err':'wait');
  t.textContent=bad?'Upload refused ('+lastErr+'). Tell the scorer.':
    n+' waiting to send'+(nokey?' – race key not loaded yet, will retry when there is signal':lastErr?' – will retry when there is signal':'…');
}
setInterval(()=>{if(S.marks.some(m=>!m.sent)||S.deletes.length)sync();},15000);
window.addEventListener('online',sync);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync();});

/* ---------- render ---------- */
function renderList(){
  const ul=$('list');ul.innerHTML='';const rm=withFix(raceMarks());
  if(!rm.length)ul.innerHTML='<li class="empty">No marks recorded for Race '+S.race+'.</li>';
  rm.forEach(m=>{const li=document.createElement('li');
    li.innerHTML='<div><div class="name">'+esc(m.name)+(m.fix>1?' – moved (fix '+m.fix+')':'')+'</div><div class="num">'+ddm(m.lat,true)+' '+ddm(m.lon,false)+'</div><div class="meta num">±'+Math.round(m.acc)+' m, '+hhmm(m.time)+' · '+(m.sent?'<span class="tick">sent ✓</span>':'<span class="pend">waiting</span>')+'</div></div><button class="del" data-id="'+m.id+'" aria-label="Delete '+esc(m.name)+'">✕</button>';
    ul.appendChild(li);});
}
function render(){
  $('event').value=S.event;$('date').value=S.date;$('csv').checked=!!S.csv;
  document.querySelectorAll('.races button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.r===S.race));
  renderList(); renderSync();
  if(watchId===null)$('record').textContent=recLabel();
  const rm=withFix(raceMarks());
  const lines=['*'+(S.event||'Series')+' – '+fmtDate(S.date)+'*','*Race '+S.race+' – laid marks*'];
  rm.forEach(m=>lines.push(m.name+(m.fix>1?' (moved, fix '+m.fix+')':'')+' – '+ddm(m.lat,true)+' '+ddm(m.lon,false)+' (±'+Math.round(m.acc)+' m, '+hhmm(m.time)+')'));
  if(S.csv&&rm.length){lines.push('','```','race,mark,fix,lat,lon,acc_m,time');rm.forEach(m=>lines.push([S.race,'"'+m.name+'"',m.fix,m.lat.toFixed(6),m.lon.toFixed(6),Math.round(m.acc),hhmm(m.time)].join(',')));lines.push('```');}
  text=rm.length?lines.join('\n'):'';
  $('preview').textContent=text||'Nothing to send yet for Race '+S.race+'.';
  const wa=$('wa');
  if(text){wa.href='https://wa.me/?text='+encodeURIComponent(text);wa.removeAttribute('aria-disabled');}else{wa.removeAttribute('href');wa.setAttribute('aria-disabled','true');}
  $('share').style.display=navigator.share?'':'none';$('copy').style.gridColumn=navigator.share?'':'1/-1';
}
function commit(){save();render();}

/* ---------- GPS ---------- */
let watchId=null,timer=null;
function recLabel(){return 'Record mark – Race '+S.race;}
function stop(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;}clearTimeout(timer);$('record').removeAttribute('aria-busy');$('record').textContent=recLabel();$('cancel').style.display='none';}
$('record').onclick=()=>{
  if(watchId!==null)return;
  const name=$('markName').value.trim();
  if(!name){setStatus('Enter or tap a mark name first.','err');$('markName').focus();return;}
  if(!('geolocation' in navigator)){setStatus('This browser has no location access. Try Chrome or Safari.','err');return;}
  let best=null;const t0=Date.now();
  $('record').setAttribute('aria-busy','true');$('record').textContent='Getting fix…';$('cancel').style.display='block';setStatus('Hold position beside the mark.');
  const finish=()=>{stop();if(!best){setStatus('No fix received. Check location is on and allowed for this page.','err');return;}
    const c=best.coords;
    const prior=raceMarks().some(m=>m.name.toLowerCase()===name.toLowerCase());
    S.marks.push({id:uid(),series:S.event,date:S.date,race:S.race,name,lat:c.latitude,lon:c.longitude,acc:c.accuracy,time:best.timestamp||Date.now(),recorder:recorder.trim(),sent:false});
    $('markName').value='';
    setStatus(prior?name+' moved: new fix kept alongside the earlier one. If the earlier fix was a mistake, delete it with ✕.':name+' recorded for Race '+S.race+', ±'+Math.round(c.accuracy)+' m.','ok');
    commit(); sync();};
  watchId=navigator.geolocation.watchPosition(p=>{
    if(!best||p.coords.accuracy<best.coords.accuracy)best=p;
    $('record').textContent='Fix ±'+Math.round(best.coords.accuracy)+' m… improving';
    if(best.coords.accuracy<=5||Date.now()-t0>10000)finish();
  },err=>{if(best){finish();return;}stop();
    setStatus(err.code===1?'Location permission was refused. Allow location for this page, then try again.':err.code===3?'GPS timed out. Try again.':'Position unavailable. Check the phone’s location setting.','err');
  },{enableHighAccuracy:true,maximumAge:0,timeout:20000});
  timer=setTimeout(finish,12000);
};
$('cancel').onclick=()=>{stop();setStatus('Fix cancelled.');};
PRESETS.forEach(n=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{$('markName').value=n;};$('chips').appendChild(b);});
document.querySelectorAll('.races button').forEach(b=>b.onclick=()=>{S.race=+b.dataset.r;setStatus('');commit();});
$('list').onclick=e=>{const b=e.target.closest('.del');if(!b)return;
  const m=S.marks.find(x=>x.id===b.dataset.id); if(!m)return;
  if(m.sent)S.deletes.push({id:m.id,date:m.date});
  S.marks=S.marks.filter(x=>x.id!==m.id); commit(); sync();};
$('event').onchange=e=>{S.event=e.target.value.trim();commit();};
$('date').onchange=e=>{S.date=e.target.value||todayISO();commit();};
$('csv').onchange=e=>{S.csv=e.target.checked;commit();};
$('recorder').value=recorder;   // kept outside S so "Start a new day" doesn't clear it
$('recorder').oninput=e=>{recorder=e.target.value;try{localStorage.setItem(RECORDER_KEY,recorder.trim());}catch(_){}};
$('share').onclick=async()=>{if(!text)return;try{await navigator.share({text});}catch(e){if(e.name!=='AbortError')setStatus('Sharing isn’t available here. Use Copy text.','err');}};
$('copy').onclick=async()=>{if(!text)return;try{await navigator.clipboard.writeText(text);$('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy text',1500);}catch(e){const r=document.createRange();r.selectNodeContents($('preview'));const s=getSelection();s.removeAllRanges();s.addRange(r);setStatus('Text selected — use the phone’s Copy.');}};
let armed=false;
$('newDay').onclick=()=>{
  const unsent=S.marks.filter(m=>!m.sent).length;
  if(!armed){armed=true;$('newDay').textContent=unsent?unsent+' fixes not sent yet – tap again to clear anyway':'Tap again to clear this phone';setTimeout(()=>{armed=false;$('newDay').textContent='Start a new day (clears this phone)';},4000);return;}
  stop();   // a fix still in progress would otherwise land in the new day
  const ev=S.event;S=fresh();S.event=ev;armed=false;$('newDay').textContent='Start a new day (clears this phone)';
  $('markName').value='';document.querySelector('details.backup').open=false;   // not held in S, so render() leaves them
  setStatus('New day started.','ok');commit();};
render(); if(newDayNote)setStatus(newDayNote); save(); sync();
})();
</script>
</body>
</html>
